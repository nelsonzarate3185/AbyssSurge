# Configuración de Supabase local para AbyssSurge.
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "AbyssSurge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["abysssurge://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = false

# ─────────────────────────────────────────────────────────────
# Edge Functions
#
# Por default Supabase exige un JWT válido en toda función. MercadoPago no
# manda uno: autentica con la firma HMAC del header x-signature. Sin este
# verify_jwt = false el webhook devuelve 401 y MercadoPago reintenta para
# siempre sin que nada se acredite.
# ─────────────────────────────────────────────────────────────

[functions.payment-webhook]
verify_jwt = false

[functions.create-payment]
verify_jwt = true

[functions.enter-dungeon]
verify_jwt = true

[functions.complete-dungeon-run]
verify_jwt = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
